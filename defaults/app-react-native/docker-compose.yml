# Local Fuseki for services/api. Same pinned image as @_linked/core.
# `npm run fuseki:up` starts it and waits for the healthcheck; `npm run fuseki:down` stops it (data persists).
services:
  fuseki:
    image: secoresearch/fuseki:5.6.0
    ports:
      # Override the host port when 3030 is taken (another project's Fuseki); set FUSEKI_BASE_URL to match.
      - "${FUSEKI_PORT:-3030}:3030"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_PASSWORD:-admin}
    volumes:
      # The whole FUSEKI_BASE: datasets created through the admin API keep their data in databases/ and their
      # definition in configuration/, so both must persist. In-memory datasets (app-test) are not persisted.
      - fuseki-data:/fuseki-base
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fuseki-data:
